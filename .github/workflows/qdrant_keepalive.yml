name: Qdrant Cloud Keep-Alive Heartbeat

on:
  schedule:
    # Runs twice a day at 00:00 and 12:00 UTC (every 12 hours)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Qdrant Cloud Cluster
        run: |
          curl -s -f -X GET "${{ secrets.QDRANT_URL }}/collections/univ_hybrid_rag" \
            -H "api-key: ${{ secrets.QDRANT_API_KEY }}" \
            -H "Content-Type: application/json"
          echo "✅ Qdrant Cloud heartbeat ping successful!"
